appId: org.open-efb.app
productName: Open EFB
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web
  - from: build/icon.png
    to: icon.png
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
# Where the built-in updater looks for new releases: the GitHub Releases page of this project.
# electron-builder writes app-update.yml from this block and publishes latest.yml with each build,
# so the installed app can check for an update on launch without any manual step.
publish:
  provider: github
  owner: Pilot-Mishari
  repo: open-efb
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Open EFB
  artifactName: Open-EFB-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  include: build/installer.nsh
